# Builds on every push and pull request; deploys main to Firebase Hosting.
# Auth is keyless (Workload Identity Federation), so no service account key is stored anywhere.
name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

env:
  # Printed by the Cloud Shell setup script. Deploy is skipped while it's empty.
  WIF_PROVIDER: projects/157327831258/locations/global/workloadIdentityPools/github/providers/storycircle
  DEPLOY_SA: github-deployer@storycircle-37772.iam.gserviceaccount.com

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: github.event_name == 'push' && env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true
      - if: github.event_name == 'push' && env.WIF_PROVIDER != ''
        run: npx -y firebase-tools@15 deploy --only hosting --non-interactive
