# StoryClock fork: builds on every push and deploys to the "storyclock" Firebase preview channel,
# never to the live StoryCircle site. Each deploy resets the channel's 30-day expiry.
# Auth is keyless (Workload Identity Federation), so no service account key is stored anywhere.
name: StoryClock preview

on:
  push:
    branches: [claude/project-thread-u4l2on]

env:
  # Printed by the Cloud Shell setup script. Deploy is skipped while it's empty.
  WIF_PROVIDER: projects/157327831258/locations/global/workloadIdentityPools/github/providers/storycircle
  DEPLOY_SA: github-deployer@storycircle-37772.iam.gserviceaccount.com

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: github.event_name == 'push' && env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true
          token_format: access_token
      - if: github.event_name == 'push' && env.WIF_PROVIDER != ''
        run: npx -y firebase-tools@15 hosting:channel:deploy storyclock --expires 30d --non-interactive
